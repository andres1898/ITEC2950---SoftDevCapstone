<h2>About</h2>

<div>

    <!--This is how you called a variable's value {{ variable }}-->
    <p>{{ about }}</p>

    <!-- Structure of an if - else statements, always endif at the end -->
    {% if author %}

    <p>A website by {{author}}</p>

    {% else %}

    <p> No author information </p>

    {% endif %}



</div>
